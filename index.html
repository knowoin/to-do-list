<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 / 欢迎页面</title>
    <style>
        /* 基础重置与全局变量 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 顶部导航栏 */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* 主体内容区域 */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        /* 横幅/Hero 区域 */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        /* 特色/卡片网格 */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 3rem;
        }

        .card {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header>
        <nav>
            <a href="#" class="logo">MyWebsite</a>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#features">特点</a></li>
                <li><a href="#about">关于</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主体内容 -->
    <main>
        <!-- 主推区 -->
        <section class="hero" id="home">
            <h1>欢迎来到我的主页</h1>
            <p>这是一个使用纯 HTML 和内置 CSS 构建的现代响应式网页模板，无需任何外部依赖。</p>
            <a href="#features" class="btn">开始探索</a>
        </section>

        <!-- 卡片内容区 -->
        <section class="features" id="features">
            <div class="card">
                <div class="card-icon">⚡</div>
                <h3>轻量快速</h3>
                <p>纯 HTML + 内联样式，无需额外引入复杂的第三方库，秒速加载。</p>
            </div>
            <div class="card">
                <div class="card-icon">📱</div>
                <h3>响应式设计</h3>
                <p>完美适配手机、平板与桌面电脑等不同尺寸的屏幕。</p>
            </div>
            <div class="card">
                <div class="card-icon">🎨</div>
                <h3>易于定制</h3>
                <p>结构简单清晰，你可以根据自己的需求随意修改文字、颜色与布局。</p>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer id="about">
        <p>&copy; 2026 MyWebsite. 保留所有权利。</p>
    </footer>

</body>
</html>
